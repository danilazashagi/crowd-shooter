<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Crowd Shooter: Math Bridge</title>
  <meta name="description" content="Math runner crowd shooter: pick + and − gates, grow your squad, evolve weapons and defeat the boss." />
  <style>
    :root {
      --blue: #2f7bff; --red: #ff3b4a; --gold: #ffd34d; --ink: #0b1020;
      --panel: rgba(8, 14, 30, 0.62);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #6fb6ff;
      font-family: "Arial Black", "Segoe UI", Arial, sans-serif; color: #fff;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .ui { position: fixed; pointer-events: none; z-index: 2; }

    #top { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      width: min(420px, 86vw); text-align: center; }
    #level { font-size: 18px; letter-spacing: 2px; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
    #progress { margin-top: 6px; height: 10px; border-radius: 6px; background: var(--panel); overflow: hidden;
      border: 2px solid rgba(255,255,255,.55); }
    #progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4ad2ff, #2f7bff); }

    #weapon { bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      background: var(--panel); border-radius: 14px; padding: 8px 16px; text-align: center;
      border: 2px solid rgba(255,255,255,.25); min-width: 210px; transition: border-color .3s, box-shadow .3s; }
    #weapon[data-tier="1"] { border-color: #ff8a2a; }
    #weapon[data-tier="2"] { border-color: #ffe9a8; }
    #weapon[data-tier="3"] { border-color: #39f3ff; box-shadow: 0 0 18px rgba(57,243,255,.6); }
    #weapon-row { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; }
    #weapon-next { font-family: Arial, sans-serif; font-weight: bold; font-size: 12px; opacity: .8; margin-top: 2px; }

    #squad-label { left: 0; top: 0; display: none; background: var(--blue); padding: 2px 12px;
      border-radius: 12px; font-size: 20px; border: 2px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.25);
      will-change: transform; }

    #boss { top: calc(max(10px, env(safe-area-inset-top)) + 54px); left: 50%; transform: translateX(-50%);
      width: min(480px, 90vw); display: none; text-align: center; }
    #boss-name { font-size: 15px; color: #ffdddd; text-shadow: 0 2px 0 #000; letter-spacing: 1px; }
    #boss-bar { margin-top: 4px; height: 16px; border-radius: 8px; background: var(--panel);
      border: 2px solid #fff; overflow: hidden; }
    #boss-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff2e3e, #ff8a2a);
      transition: width .12s linear; }

    #toast { top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
      font-size: clamp(26px, 6vw, 48px); text-align: center; white-space: nowrap;
      text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 0 22px rgba(255,255,255,.5); transition: all .25s ease-out; }
    #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #toast.t1 { color: #ffb36b; } #toast.t2 { color: #fff0c0; } #toast.t3 { color: #6ff7ff; }
    #toast.bad { color: #ff7d86; }

    #popups { inset: 0; overflow: hidden; }
    .popup { position: absolute; transform: translate(-50%, -50%); font-size: 30px;
      animation: rise .9s ease-out forwards; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
    .popup.pos { color: #8ff0ff; } .popup.neg { color: #ff7d86; }
    @keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -70px; } }

    #start-hint { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding-bottom: 12vh; gap: 10px; }
    #start-hint .hand { font-size: 46px; animation: swipe 1.4s ease-in-out infinite; }
    #start-hint .txt { font-size: 20px; background: var(--panel); padding: 8px 18px; border-radius: 12px; }
    @keyframes swipe { 0%,100% { transform: translateX(-50px); } 50% { transform: translateX(50px); } }

    #overlay { inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: rgba(5, 10, 25, .55); }
    #overlay-title { font-size: clamp(34px, 8vw, 64px); text-shadow: 0 5px 0 rgba(0,0,0,.4); }
    #overlay.win #overlay-title { color: var(--gold); }
    #overlay.lose #overlay-title { color: var(--red); }
    #overlay-sub { font-family: Arial, sans-serif; font-weight: bold; font-size: 18px; opacity: .9; }
    #overlay-prompt { font-size: 18px; animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }

    #fps { top: 6px; right: 8px; font: bold 12px monospace; opacity: .6; display: none; }
    body.debug #fps { display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="top" class="ui">
    <div id="level">LEVEL 1</div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>

  <div id="boss" class="ui">
    <div id="boss-name">MECHA-ZOMBIE TANK</div>
    <div id="boss-bar"><div id="boss-fill"></div></div>
  </div>

  <div id="squad-label" class="ui">4</div>
  <div id="popups" class="ui"></div>
  <div id="toast" class="ui"></div>

  <div id="weapon" class="ui" data-tier="0">
    <div id="weapon-row"><span id="weapon-icon">🔫</span><span id="weapon-name">PISTOLS</span></div>
    <div id="weapon-next"></div>
  </div>

  <div id="start-hint" class="ui">
    <div class="hand">👆</div>
    <div class="txt">DRAG or A / D to steer</div>
  </div>

  <div id="overlay" class="ui">
    <div id="overlay-title"></div>
    <div id="overlay-sub"></div>
    <div id="overlay-prompt"></div>
  </div>

  <div id="fps" class="ui"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
